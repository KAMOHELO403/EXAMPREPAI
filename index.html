<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPrep AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 0;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
        }

        #studentIdentity {
            margin-top: 12px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        select {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin-top: 10px;
        }

        #usernameInput {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .navigation button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            margin-top: 15px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #444;
        }

        #message {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 8px;
            display: none;
        }

        #markingResult {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f2f4f7;
            white-space: pre-wrap;
        }

        #markingResult[hidden] {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>🎓 ExamPrep AI</h1>
        <p>Practice. Answer. Improve.</p>
        <p id="studentIdentity" hidden></p>
    </header>

    <main class="container">
        <section id="usernamePage" class="card">
            <h2>Enter your username</h2>
            <p>Enter your username to begin. No password is needed.</p>
            <form id="usernameForm">
                <label for="usernameInput">Username</label>
                <input
                    id="usernameInput"
                    name="username"
                    type="text"
                    maxlength="50"
                    autocomplete="username"
                    required>
                <button type="submit">Start practicing</button>
            </form>
        </section>

        <div id="practicePage" hidden>
        <div class="card">
            <h2>📚 Physiology</h2>
            <p>Higher-Order Thinking Questions</p>
        </div>

        <div class="card">
            <h2>Choose a Question</h2>
            <label for="questionSelect">Question</label>
            <select id="questionSelect">
                <option value="1">Question 1</option>
                <option value="2">Question 2</option>
                <option value="3">Question 3</option>
                <option value="4">Question 4</option>
                <option value="5">Question 5</option>
                <option value="6">Question 6</option>
                <option value="7">Question 7</option>
                <option value="8">Question 8</option>
                <option value="9">Question 9</option>
                <option value="10">Question 10</option>
                <option value="11">Question 11</option>
                <option value="12">Question 12</option>
                <option value="13">Question 13</option>
                <option value="14">Question 14</option>
                <option value="15">Question 15</option>
                <option value="16">Question 16</option>
                <option value="17">Question 17</option>
                <option value="18">Question 18</option>
                <option value="19">Question 19</option>
                <option value="20">Question 20</option>
                <option value="21">Question 21</option>
                <option value="22">Question 22</option>
                <option value="23">Question 23</option>
                <option value="24">Question 24</option>
                <option value="25">Question 25</option>
                <option value="26">Question 26</option>
                <option value="27">Question 27</option>
                <option value="28">Question 28</option>
                <option value="29">Question 29</option>
                <option value="30">Question 30</option>
                <option value="31">Question 31</option>
                <option value="32">Question 32</option>
                <option value="33">Question 33</option>
                <option value="34">Question 34</option>
                <option value="35">Question 35</option>
            </select>
        </div>

        <div class="card">
            <p id="questionText" class="question" aria-live="polite"></p>
            <label for="studentAnswer">Your answer</label>
            <textarea id="studentAnswer" placeholder="Write your answer here..."></textarea>
            <div class="navigation">
                <button id="previousButton" type="button">Previous</button>
                <span id="progress" aria-live="polite"></span>
                <button id="nextButton" type="button">Next</button>
            </div>
            <button id="markButton" type="button">Mark Answer</button>
            <div id="message" role="status" aria-live="polite"></div>
            <section id="markingResult" aria-live="polite" hidden>
                <h2>Marking feedback</h2>
                <p id="score"></p>
                <p id="feedback"></p>
                <div id="correctAnswerPanel" hidden>
                    <h3>Correct answer</h3>
                    <p id="correctAnswer"></p>
                </div>
            </section>
        </div>
        </div>
    </main>

    <script>
        const MARKING_ENDPOINT = "http://localhost:3000/mark";

        const questions = {
            1: "A student eats a meal containing bread, eggs and avocado before training. Trace the digestion and absorption of the major carbohydrate, protein and lipid components of this meal. For each nutrient, identify the important enzymes, final products of digestion and route of absorption.",

            2: "A person produces normal amounts of pancreatic amylase but has very low levels of maltase in the brush border of the small intestine. Predict how this would affect carbohydrate digestion and glucose availability. Explain your answer.",

            3: "An athlete has reduced pancreatic lipase secretion. Predict how this could affect fat digestion, absorption and energy availability during exercise.",


            4: "Explain why bile is important for lipid digestion even though bile itself is not a digestive enzyme. What would happen to lipid digestion if insufficient bile reached the duodenum?",

            5: "Compare the absorption of glucose, fructose and dietary lipids. Your answer should consider the transport mechanisms and how each nutrient ultimately reaches circulation.",

            6: "A patient has damage to the villi and brush border of the small intestine. Explain how this could affect the digestion and absorption of carbohydrates and proteins and predict one possible consequence for physical performance.",

            7: "Explain why the stomach is important for protein digestion but is not the major site of nutrient absorption.",

            8: "A long-distance runner consumes a high-carbohydrate meal several hours before a race. Explain the physiological journey from ingestion of the carbohydrate to its eventual contribution to ATP production during the race.",

            9: "Two athletes consume meals containing the same amount of energy. Athlete A consumes mainly carbohydrate while Athlete B consumes mainly fat. Explain how the digestion, absorption and transport of these nutrients differ.",

            10: "Explain why chylomicrons are required for the transport of absorbed long-chain dietary lipids. Include the roles of enterocytes, lacteals and the lymphatic system in your answer.",

            11: "Blood glucose rises after a carbohydrate-rich meal. Explain how the pancreas detects and responds to this change and how the response helps restore blood glucose homeostasis.",

            12: "During prolonged exercise, an athlete's blood glucose begins to decrease. Predict the change in insulin and glucagon activity and explain how these changes help maintain energy availability.",

            13: "An athlete has normal insulin secretion but the muscle cells respond poorly to insulin. Predict how this could affect glucose uptake by skeletal muscle and exercise energy supply.",

            14: "Compare the physiological roles of insulin and glucagon. Why would simultaneous maximal action of both hormones be physiologically inappropriate?",

            15: "A person has abnormally low concentrations of T3 and T4. Using the normal functions of thyroid hormones, predict possible effects on basal metabolic rate, energy expenditure, thermoregulation and exercise performance.",

            16: "TSH secretion from the pituitary gland is greatly reduced. Predict what could happen to thyroid hormone secretion and explain the physiological reasoning behind your prediction.",

            17: "Growth hormone secretion increases following exercise. Explain why this hormonal response may be relevant to muscle and bone tissue in a physically active person.",

            18: "ACTH stimulates cortisol release as part of the stress response. Explain why hormonal regulation of the stress response may be important during demanding physical activity.",

            19: "Explain why the pituitary gland is described as a 'master gland'. Use at least two specific hormones and their target glands or tissues to support your explanation.",

            20: "Testosterone and estrogen act through nuclear receptors. Explain how this differs conceptually from a hormone acting through a cell-surface receptor and relate your answer to the effects of reproductive hormones on muscle or bone.",

            21: "A student eats a carbohydrate-rich meal and then exercises two hours later. Explain how the digestive and endocrine systems work together from the time the food is eaten until glucose is being used by exercising muscle.",

            22: "After a meal, glucose is absorbed from the small intestine into the bloodstream. Explain why absorption alone is not enough to ensure that glucose becomes available to muscle cells. Include the role of insulin.",

            23: "During a marathon, stored glycogen becomes increasingly important. Explain how carbohydrate digestion before the event, glucose absorption, insulin activity and later glucagon activity can contribute to maintaining the athlete's energy supply.",

            24: "An athlete has normal digestion and absorption but impaired pancreatic endocrine function. Explain why the athlete may still experience problems with energy regulation despite nutrients being successfully absorbed.",

            25: "Another athlete has normal insulin and glucagon secretion but severe intestinal malabsorption. Explain why normal endocrine function cannot completely compensate for poor nutrient absorption.",

            26: "Construct a physiological chain linking the following concepts: carbohydrate ingestion, amylase, glucose absorption, blood glucose, insulin, muscle glucose uptake, glycogen and ATP production.",

            27: "Construct a physiological chain linking the following concepts: dietary triglycerides, bile salts, pancreatic lipase, micelles, enterocytes, chylomicrons, lacteals and systemic circulation.",

            28: "A student claims that the digestive system provides energy to muscles. Critically explain why this statement is incomplete. Your answer should distinguish digestion, absorption, transport, hormonal regulation and cellular ATP production.",

            29: "Explain how the pancreas demonstrates the integration of the digestive and endocrine systems. Include both its digestive and hormonal functions.",

            30: "Design a short explanation for an athlete showing how a pre-exercise meal, the small intestine, pancreas, liver and skeletal muscle cooperate to maintain energy availability during exercise.",

            31: "Case Study: Post-meal Exercise. A student eats a large carbohydrate meal and begins exercising shortly afterwards. Explain the expected sequence of events involving carbohydrate digestion, glucose absorption, insulin secretion and glucose uptake by muscle. Then predict how the hormonal response may change as exercise continues and circulating glucose begins to fall.",

            32: "Case Study: Poor Fat Absorption. An athlete has a condition that greatly reduces the release of bile into the small intestine. The athlete can still produce pancreatic lipase. Analyze why fat absorption may nevertheless be impaired and explain the consequences for chylomicron formation and lipid transport.",

            33: "Case Study: Thyroid and Performance. A recreational runner develops reduced thyroid hormone secretion. Without diagnosing the individual, use the physiological functions of T3 and T4 to explain how reduced thyroid activity could influence metabolism, temperature regulation and the runner's capacity to sustain exercise.",

            34: "Case Study: Protein Recovery. Following resistance exercise, an athlete consumes a protein-rich meal. Trace the protein from the stomach until its amino acids reach the bloodstream. Then explain why digestion and absorption are necessary before those amino acids can contribute to tissue repair.",

            35: "Case Study: Two Systems, One Goal. A runner completes a long training session and then consumes a mixed recovery meal. Explain how at least THREE digestive processes and THREE endocrine responses or functions could contribute to restoring homeostasis and supporting recovery. Make clear connections between the two systems."
        };

        const modelAnswers = {
            1: "Bread contains starch, which begins digestion in the mouth with salivary amylase. In the small intestine, pancreatic amylase continues starch digestion, producing maltose and short oligosaccharides; brush-border enzymes such as maltase then release glucose. Egg protein is denatured by stomach acid and digestion begins with pepsin. Pancreatic proteases and intestinal peptidases break peptides down into amino acids and small peptides. Avocado triglycerides are emulsified by bile salts, then pancreatic lipase digests them mainly into fatty acids and monoglycerides. Glucose and amino acids are absorbed into intestinal capillaries and travel to the liver through the hepatic portal vein. Long-chain lipid products enter enterocytes, are reassembled into triglycerides and packaged into chylomicrons, which enter lacteals, pass through lymph and then reach systemic circulation.",
            2: "If maltase is very low, starch digestion will be incomplete because maltose cannot be efficiently converted to glucose in the brush border. The person may have normal pancreatic amylase, so pancreatic digestion of starch still starts, but the final carbohydrate breakdown to glucose is reduced. Less glucose is available for absorption, so blood glucose may rise less after meals and overall carbohydrate availability for ATP production falls.",
            3: "Reduced pancreatic lipase would impair triglyceride digestion, so fewer fatty acids and monoglycerides would be produced. Fat absorption would fall, reducing chylomicron formation and decreasing fat-derived energy supply during exercise. The athlete would have poorer lipid availability and may feel less energetic during prolonged activity.",
            4: "Bile salts emulsify large fat droplets into smaller droplets, increasing the surface area for pancreatic lipase to act on. Without enough bile, triglycerides remain poorly emulsified, lipase activity is reduced, and fat digestion is incomplete. Absorption of fatty acids and monoglycerides falls, so less dietary lipid is available for energy and chylomicron formation.",
            5: "Glucose is absorbed by sodium-dependent secondary active transport via SGLT1 in enterocytes, while fructose enters by facilitated diffusion through GLUT5. Dietary lipids are digested to fatty acids and monoglycerides, absorbed into enterocytes, reassembled into triglycerides, packaged into chylomicrons and transported via lymphatics. Glucose and fructose enter capillaries and travel to the liver via the portal vein, whereas lipids usually reach the blood via lymph and then systemic circulation.",
            6: "Damage to villi and the brush border reduces surface area and destroys digestive enzymes and transporters. Carbohydrate digestion and protein digestion would be less efficient, and absorption of glucose, amino acids and dipeptides would be reduced. This could reduce energy supply during exercise and lead to fatigue, poor recovery or weight loss.",
            7: "The stomach is essential for protein digestion because acid denatures proteins and pepsin begins breaking peptide bonds. However, the stomach is not the main site of absorption because its lining is not specialised for efficient uptake of nutrients; most absorption occurs in the small intestine, which has villi, microvilli and extensive blood supply.",
            8: "A high-carbohydrate meal is digested in the mouth and small intestine, where amylase breaks starch into maltose and glucose. Glucose is absorbed across the intestinal epithelium into the blood, raising blood glucose and stimulating insulin release. Insulin promotes glucose uptake into muscle and liver cells, where glucose is stored as glycogen or used in glycolysis to generate ATP during the race.",
            9: "Carbohydrate digestion begins with amylase and produces glucose, which is absorbed rapidly into the portal circulation and can be used quickly for energy. Fat digestion relies on emulsification by bile and lipase action to produce fatty acids and monoglycerides, which are absorbed into enterocytes and packaged in chylomicrons before entering lymph and systemic blood. Carbohydrate is therefore more rapidly available for immediate ATP generation, while fat is slower to digest and absorb but provides a more sustained energy reserve.",
            10: "Long-chain fatty acids and monoglycerides are absorbed into enterocytes, where they are re-esterified to triglycerides. Because triglycerides are hydrophobic and do not dissolve in blood, they are packaged into chylomicrons for transport. Chylomicrons enter lacteals in the villi, travel through lymphatic vessels and then drain into the bloodstream, allowing dietary lipids to reach tissues.",
            11: "After a carbohydrate-rich meal, blood glucose rises and beta cells in the pancreas sense this through glucose uptake and metabolism. The pancreas releases insulin, which promotes glucose uptake by tissues such as muscle and liver and stimulates glycogen synthesis while suppressing hepatic glucose output. This reduces blood glucose back toward normal and restores homeostasis.",
            12: "During prolonged exercise, blood glucose falls, so insulin secretion decreases and glucagon secretion rises. Lower insulin reduces glucose storage and allows more glucose to be released from liver glycogen, while higher glucagon stimulates glycogenolysis and gluconeogenesis. These changes help maintain circulating glucose and energy availability for the brain and exercising muscle.",
            13: "If muscle cells respond poorly to insulin, GLUT4 translocation is reduced and glucose uptake into skeletal muscle falls. The athlete would have lower muscle glycogen storage and less fuel available for glycolysis and ATP production during exercise, so performance would be impaired.",
            14: "Insulin promotes anabolism and storage after feeding by increasing glucose uptake, glycogen synthesis and fat storage. Glucagon promotes catabolism between meals by stimulating glycogen breakdown and glucose production in the liver. Maximal simultaneous action of both hormones would oppose each other and prevent effective regulation of blood glucose, which is physiologically inappropriate.",
            15: "Low T3 and T4 reduce basal metabolic rate, so resting energy expenditure falls and heat production decreases. The person may feel cold, have reduced thermoregulation and lower exercise tolerance because less ATP generation and metabolic activity occur. Performance may be impaired because thyroid hormones normally support energy metabolism and aerobic capacity.",
            16: "If TSH from the pituitary is greatly reduced, the thyroid gland receives less stimulation and produces less T3 and T4. This lowers thyroid hormone secretion, reducing metabolic rate and heat production. The body’s endocrine control of metabolism becomes less effective.",
            17: "Growth hormone is relevant to muscle and bone because it supports protein synthesis and stimulates tissue growth and repair. During and after exercise, it can help promote muscle adaptation and bone maintenance, especially in a physically active person.",
            18: "Cortisol helps mobilise fuel during stress by increasing glucose availability and promoting fat and protein metabolism. During demanding physical activity, hormonal regulation of the stress response supports energy supply, blood pressure, and adaptation to exercise stress.",
            19: "The pituitary gland is called the master gland because it secretes hormones that regulate other endocrine glands. For example, ACTH stimulates the adrenal cortex to release cortisol, and TSH stimulates the thyroid gland to release T3 and T4. It also controls growth and reproduction through hormones such as GH and gonadotrophins.",
            20: "Steroid hormones such as testosterone and oestrogen diffuse through the plasma membrane and bind nuclear receptors, altering gene transcription. By contrast, peptide or amino-acid-based hormones bind cell-surface receptors and usually activate second messenger pathways. Reproductive hormones influence muscle protein synthesis, bone mineralisation and development of secondary sexual characteristics.",
            21: "After a carbohydrate-rich meal, digestion in the mouth and small intestine releases glucose, which is absorbed into the blood. The rise in blood glucose activates pancreatic beta cells to secrete insulin, which facilitates uptake of glucose into muscle cells and promotes glycogen storage. During exercise, muscle uses glucose for ATP production and the endocrine response shifts toward mobilising stored fuel to maintain blood glucose.",
            22: "Absorption alone does not guarantee glucose is available to muscle because the glucose must also be transported into cells and regulated in response to energy needs. Insulin is required for efficient glucose uptake by muscle and liver cells, especially after a meal, so without adequate insulin action muscle may not receive enough fuel.",
            23: "Before a marathon, carbohydrate digestion provides glucose that is absorbed into the blood and partly stored as liver and muscle glycogen. Insulin helps store glucose immediately after eating, while later during the event glucagon rises as glucose falls and promotes glycogen breakdown and gluconeogenesis. This sequence helps maintain glucose supply and ATP production throughout endurance exercise.",
            24: "Normal digestion and absorption mean nutrients can enter the blood, but endocrine function still matters because the pancreas also regulates metabolism. If endocrine function is impaired, insulin and glucagon secretion may be inadequate, so blood glucose and energy availability cannot be controlled properly even though nutrients are absorbed.",
            25: "Even with normal insulin and glucagon, poor intestinal absorption means too little glucose, amino acids and fatty acids reach the body. The endocrine system can regulate available fuel, but it cannot replace nutrients that never enter the circulation. This limits tissue energy supply and recovery.",
            26: "Carbohydrate ingestion is followed by salivary and pancreatic amylase digestion of starch to glucose. Glucose is absorbed into the bloodstream, increasing blood glucose, which stimulates insulin secretion. Insulin promotes glucose uptake into muscle cells, where glucose is stored as glycogen and then used in glycolysis and cellular respiration to generate ATP.",
            27: "Dietary triglycerides are emulsified by bile salts and digested by pancreatic lipase into fatty acids and monoglycerides. These enter enterocytes, are reassembled into triglycerides and packaged into chylomicrons. Chylomicrons enter lacteals, pass through the lymphatic system and eventually reach systemic circulation.",
            28: "The statement is incomplete because digestion, absorption, transport, endocrine control and cellular metabolism are distinct steps. Digestion breaks food down, absorption moves nutrients into the body, transport carries them to tissues, hormones regulate their use, and ATP generation occurs inside cells. Muscles do not receive energy directly from digestion alone; they require absorbed nutrients and metabolic processing.",
            29: "The pancreas integrates digestion and endocrine control because it has both exocrine and endocrine functions. Its exocrine tissue secretes digestive enzymes into the small intestine, while its endocrine cells, especially beta and alpha cells, secrete insulin and glucagon into the bloodstream to regulate blood glucose and metabolism.",
            30: "Before exercise, a carbohydrate meal is digested in the intestine and glucose is absorbed into the bloodstream. The pancreas releases insulin to help store excess glucose and maintain glucose homeostasis, while the liver stores glycogen and releases glucose when needed. During exercise, skeletal muscle takes up glucose and uses it to generate ATP, allowing energy availability to be maintained.",
            31: "After a large carbohydrate meal, starch is digested by amylase and glucose is absorbed across the small intestine into the blood. This raises blood glucose and stimulates insulin secretion, which increases glucose uptake by muscle and liver cells. As exercise continues and circulating glucose begins to fall, insulin decreases and glucagon rises to promote glycogenolysis and gluconeogenesis, helping maintain fuel supply.",
            32: "Reduced bile release impairs emulsification of dietary fat, so pancreatic lipase has less access to fat droplets and digestion is less complete. Fatty acids and monoglycerides are absorbed less efficiently, chylomicron formation declines, and lipid transport from the intestine is impaired. This reduces the availability of dietary fat for energy storage and use.",
            33: "Reduced T3 and T4 secretion lowers metabolic rate, reduces thermogenesis and can decrease exercise tolerance. The runner may feel cold, tire more quickly, and show reduced capacity for sustained aerobic work because thyroid hormones normally support metabolism, heat production and energy use.",
            34: "Protein digestion begins in the stomach, where pepsin and acid begin to break proteins into smaller peptide fragments. In the small intestine, pancreatic enzymes and brush border peptidases continue digestion to amino acids and small peptides, which are absorbed into the blood via intestinal epithelial cells. Digestion and absorption are necessary because the body cannot efficiently use whole proteins for tissue repair; amino acids must be released and absorbed before they can be used for muscle and tissue synthesis.",
            35: "After a long training session, the body needs to restore fluid, glycogen, and tissue repair. Digestion of carbohydrate, protein and fat in the digestive tract supplies glucose, amino acids and fatty acids, while absorption into the bloodstream delivers them to tissues. Hormones such as insulin, glucagon, cortisol and growth hormone help coordinate nutrient storage, recovery, and homeostasis, so the digestive and endocrine systems work together to restore balance and support adaptation."
        };

        const questionIds = Object.keys(questions).map(Number);
        const answers = Object.fromEntries(questionIds.map(id => [id, ""]));
        const marks = {};

        const questionSelect = document.getElementById("questionSelect");
        const questionText = document.getElementById("questionText");
        const answerBox = document.getElementById("studentAnswer");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");
        const markButton = document.getElementById("markButton");
        const progress = document.getElementById("progress");
        const message = document.getElementById("message");
        const markingResult = document.getElementById("markingResult");
        const scoreText = document.getElementById("score");
        const feedbackText = document.getElementById("feedback");
        const correctAnswerText = document.getElementById("correctAnswer");
        const correctAnswerPanel = document.getElementById("correctAnswerPanel");
        const usernamePage = document.getElementById("usernamePage");
        const practicePage = document.getElementById("practicePage");
        const usernameForm = document.getElementById("usernameForm");
        const usernameInput = document.getElementById("usernameInput");
        const studentIdentity = document.getElementById("studentIdentity");

        function calculateLocalScore(answer, selected) {
            const cleaned = answer.trim();
            if (!cleaned) {
                return {
                    score: 0,
                    feedback: "Please write an answer before submitting it for marking.",
                    correctAnswer: modelAnswers[selected] || ""
                };
            }

            const answerLower = cleaned.toLowerCase().replace(/[^a-z0-9\s]/g, " ");
            const modelText = (modelAnswers[selected] || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ");
            const stopWords = new Set(["about", "after", "also", "and", "are", "because", "been", "before", "being", "between", "both", "but", "can", "could", "does", "during", "each", "for", "from", "have", "into", "more", "most", "not", "only", "other", "should", "some", "such", "than", "that", "the", "their", "them", "then", "there", "these", "they", "this", "those", "through", "was", "were", "what", "when", "which", "while", "with", "would"]);
            const modelTerms = [...new Set(modelText.split(/\s+/).filter(term => term.length > 3 && !stopWords.has(term)))];
            const answerTerms = new Set(answerLower.split(/\s+/).filter(term => term.length > 3 && !stopWords.has(term)));
            const overlap = modelTerms.filter(term => answerTerms.has(term)).length;
            const coreConcepts = selected === 1
                ? [
                    /starch|carbohydrat/i.test(cleaned) && /amylase/i.test(cleaned),
                    /protein/i.test(cleaned) && /pepsin/i.test(cleaned) && /stomach|gastric|acid/i.test(cleaned),
                    /protein/i.test(cleaned) && /amino acid|peptide/i.test(cleaned) && /pancreatic|protease|peptidase|trypsin/i.test(cleaned),
                    /bile/i.test(cleaned) && /emulsif|droplet/i.test(cleaned),
                    /lipase/i.test(cleaned) && /fatty acid|monoglyceride/i.test(cleaned),
                    /glucose|amino acid/i.test(cleaned) && /portal|capillar/i.test(cleaned),
                    /chylomicron/i.test(cleaned) && /lymph|lacteal/i.test(cleaned)
                ]
                : null;
            const conceptCoverage = coreConcepts
                ? coreConcepts.filter(Boolean).length / coreConcepts.length
                : (modelTerms.length ? overlap / modelTerms.length : 0);
            const words = answerLower.trim().split(/\s+/).filter(Boolean).length;
            const hasCausalReasoning = /\b(because|therefore|so that|as a result|which causes|which means|leading to|results in)\b/i.test(cleaned);

            let score = Math.round(conceptCoverage * 80 + (hasCausalReasoning ? 10 : 0) + Math.min(10, Math.max(0, (words - 8) / 4)));
            if (answerTerms.size <= 2) {
                score = Math.min(score, 5);
            } else if (words < 8) {
                score = Math.min(score, 15);
            } else if (words < 15) {
                score = Math.min(score, 30);
            } else if (words < 25) {
                score = Math.min(score, 50);
            }
            score = Math.max(0, Math.min(100, score));

            let feedback;
            if (words < 4 || answerTerms.size <= 2) {
                feedback = "This is too brief to demonstrate understanding. Write a complete explanation using the relevant physiological steps. The model answer below shows what to include.";
            } else if (score >= 85) {
                feedback = "Strong response. You covered most of the key concepts and connected them clearly.";
            } else if (score >= 70) {
                feedback = "Good understanding. Check the model answer below for important steps or details you may have missed.";
            } else if (score >= 45) {
                feedback = "Part of your answer is relevant, but several key concepts or links are missing. Compare it with the model answer below.";
            } else {
                feedback = "Your answer does not yet demonstrate enough of the required concepts. Review the model answer and try again in your own words.";
            }

            return {
                score,
                feedback,
                correctAnswer: modelAnswers[selected] || ""
            };
        }

        function renderQuestion() {
            const selected = Number(questionSelect.value);
            const currentIndex = questionIds.indexOf(selected);

            questionText.textContent = `${selected}. ${questions[selected]}`;
            answerBox.value = answers[selected];
            previousButton.disabled = currentIndex === 0;
            nextButton.disabled = currentIndex === questionIds.length - 1;
            progress.textContent =
                `Question ${currentIndex + 1} of ${questionIds.length} · ` +
                `${questionIds.filter(id => answers[id].trim()).length} answered`;

            message.style.display = "none";
            markingResult.hidden = !marks[selected];
            if (marks[selected]) {
                scoreText.textContent = `Score: ${marks[selected].score}`;
                feedbackText.textContent = marks[selected].feedback;
                const correctAnswer = marks[selected].correctAnswer || modelAnswers[selected] || "";
                correctAnswerText.textContent = correctAnswer;
                correctAnswerPanel.hidden = !correctAnswer;
            } else {
                scoreText.textContent = "";
                feedbackText.textContent = "";
                correctAnswerText.textContent = "";
                correctAnswerPanel.hidden = true;
            }
        }

        function changeQuestion(step) {
            const currentIndex = questionIds.indexOf(Number(questionSelect.value));
            const nextIndex = currentIndex + step;

            if (nextIndex >= 0 && nextIndex < questionIds.length) {
                questionSelect.value = String(questionIds[nextIndex]);
                renderQuestion();
            }
        }

        usernameForm.addEventListener("submit", event => {
            event.preventDefault();
            const username = usernameInput.value.trim();

            if (!username) {
                usernameInput.value = "";
                usernameInput.reportValidity();
                return;
            }

            studentIdentity.textContent = `Username: ${username}`;
            studentIdentity.hidden = false;
            usernamePage.hidden = true;
            practicePage.hidden = false;
        });

        async function markAnswer() {
            const selected = Number(questionSelect.value);
            const answer = answerBox.value.trim();

            answers[selected] = answerBox.value;
            message.style.display = "block";
            markingResult.hidden = true;

            if (!answer) {
                message.textContent = "Please write an answer before requesting marking.";
                return;
            }

            markButton.disabled = true;
            markButton.textContent = "Marking...";
            message.textContent = "Sending your answer for marking...";

            try {
                let result;
                let statusMessage = "Marking complete.";

                try {
                    const response = await fetch(MARKING_ENDPOINT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            questionNumber: selected,
                            question: questions[selected],
                            answer
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Marking service returned HTTP ${response.status}.`);
                    }

                    result = await response.json();
                } catch (networkError) {
                    result = calculateLocalScore(answer, selected);
                    statusMessage = "The marking server is unavailable, so a local score has been generated instead.";
                }

                if (
                    !result ||
                    (typeof result.score !== "number" && typeof result.score !== "string") ||
                    typeof result.feedback !== "string"
                ) {
                    throw new Error("The marking service response must include a score and feedback.");
                }

                marks[selected] = {
                    score: Number(result.score),
                    feedback: result.feedback,
                    correctAnswer: typeof result.correctAnswer === "string" ? result.correctAnswer : modelAnswers[selected] || ""
                };
                renderQuestion();
                message.textContent = statusMessage;
            } catch (error) {
                const fallback = calculateLocalScore(answer, selected);
                marks[selected] = {
                    score: fallback.score,
                    feedback: fallback.feedback,
                    correctAnswer: fallback.correctAnswer
                };
                renderQuestion();
                message.textContent =
                    "The marking service is unavailable, so a local fallback score has been used instead.";
            } finally {
                markButton.disabled = false;
                markButton.textContent = "Mark Answer";
            }
        }

        questionSelect.addEventListener("change", renderQuestion);
        answerBox.addEventListener("input", () => {
            const selected = Number(questionSelect.value);
            answers[selected] = answerBox.value;
            marks[selected] = undefined;
            markingResult.hidden = true;
            progress.textContent =
                `Question ${questionIds.indexOf(selected) + 1} of ${questionIds.length} · ` +
                `${questionIds.filter(id => answers[id].trim()).length} answered`;
        });
        previousButton.addEventListener("click", () => changeQuestion(-1));
        nextButton.addEventListener("click", () => changeQuestion(1));
        markButton.addEventListener("click", markAnswer);

        renderQuestion();
    </script>
</body>
</html>
