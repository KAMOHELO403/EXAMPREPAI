<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #0f172a;
      --border: #dbe2ec;
      --success: #166534;
      --success-bg: #dcfce7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --warning: #c2410c;
      --warning-bg: #ffedd5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      background: var(--accent);
      color: #fff;
      padding: 24px 20px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.5rem);
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    #studentIdentity {
      margin-top: 12px;
      color: #dbeafe;
      font-size: 0.95rem;
    }

    #logoutButton {
      margin-top: 12px;
      padding: 10px 18px;
      border: none;
      border-radius: 7px;
      background: #b91c1c;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #logoutButton:hover { background: #991b1b; }

    .container {
      max-width: 980px;
      margin: 32px auto;
      padding: 0 18px 48px;
    }

    .card {
      background: var(--panel);
      border-radius: 14px;
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.08);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 { margin-top: 0; }

    .loading {
      text-align: center;
      font-size: 1.1rem;
      padding: 36px 20px;
    }

    .moduleButtons {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .moduleButton {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      padding: 22px 18px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .moduleButton:hover {
      transform: translateY(-1px);
    }

    .moduleButton.active {
      background: var(--primary);
    }

    .moduleButton strong {
      display: block;
      font-size: 1.25rem;
    }

    .moduleButton span {
      display: block;
      margin-top: 8px;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      padding: 12px 14px;
      font-size: 1rem;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    .options {
      margin-top: 16px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fafcff;
      margin: 10px 0;
      cursor: pointer;
    }

    .option:hover {
      background: #eef4ff;
    }

    .option input {
      margin: 0;
      transform: scale(1.1);
    }

    .questionType {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: bold;
      background: #e5e7eb;
      color: #374151;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .question {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      line-height: 1.5;
      font-weight: bold;
    }

    .navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .navButton,
    button {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 1rem;
    }

    .navButton:hover,
    button:hover {
      background: #374151;
    }

    .navButton:disabled,
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #markButton {
      display: block;
      width: 100%;
      margin-top: 18px;
      background: var(--primary);
      font-weight: bold;
    }

    #markButton:hover { background: var(--primary-dark); }

    #progress {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      flex: 1;
    }

    #message {
      margin-top: 18px;
      display: none;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.95rem;
    }

    #markingResult {
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }

    #markingResult[hidden] {
      display: none;
    }

    #score {
      font-weight: bold;
      margin: 0 0 8px;
    }

    #feedback {
      margin: 0 0 10px;
      line-height: 1.5;
    }

    #correctAnswerPanel {
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    #correctAnswerPanel h3 {
      margin: 0 0 8px;
    }

    #correctAnswer {
      margin: 0;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .moduleButtons {
        grid-template-columns: 1fr;
      }

      .navigation {
        flex-direction: column;
        align-items: stretch;
      }

      .navButton {
        width: 100%;
      }
    }
  </style>
</head>

      {
        type: "short",
        question: "If muscle cells respond poorly to insulin, predict how this would affect glucose uptake, glycogen storage and exercise performance.",
        answer: "If muscle cells respond poorly to insulin, GLUT4 translocation is reduced and glucose uptake into skeletal muscle falls. This reduces glycogen storage and ATP production during exercise, so performance is impaired."
      },
      {
        type: "short",
        question: "Explain the physiological reason that insulin and glucagon cannot both act maximally at the same time.",
        answer: "Insulin promotes storage and anabolism after feeding by increasing glucose uptake and glycogen synthesis, while glucagon promotes mobilisation and catabolism by encouraging hepatic glucose release. Both hormones cannot be maximally active at the same time because they would oppose each other and prevent effective regulation of blood glucose."
      },
      {
        type: "short",
        question: "A person has abnormally low thyroid hormone levels. Predict the effects on basal metabolic rate, thermoregulation and exercise performance.",
        answer: "Low T3 and T4 reduce basal metabolic rate and heat production, so the person may feel cold and have lower energy expenditure. Exercise performance may be impaired because thyroid hormones normally support metabolism, thermoregulation and efficient aerobic energy use."
      },
      {
        type: "short",
        question: "If TSH secretion from the pituitary is very low, explain how this would affect the thyroid gland and overall metabolism.",
        answer: "If TSH secretion from the pituitary is very low, the thyroid receives less stimulation and produces less T3 and T4. This reduces metabolic rate and heat production, causing a lower overall metabolic response."
      }
    ];

    const moduleData = {
      HUS121: hus121Questions,
      HUS122: hus122Questions
    };

    const state = {
      currentModule: "HUS121",
      currentQuestion: 0,
      answers: { HUS121: {}, HUS122: {} },
      marks: { HUS121: {}, HUS122: {} }
    };

    const loadingPage = document.getElementById("loadingPage");
    const practicePage = document.getElementById("practicePage");
    const questionSelect = document.getElementById("questionSelect");
    const questionText = document.getElementById("questionText");
    const questionType = document.getElementById("questionType");
    const optionsContainer = document.getElementById("optionsContainer");
    const writtenAnswerContainer = document.getElementById("writtenAnswerContainer");
    const answerBox = document.getElementById("studentAnswer");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const markButton = document.getElementById("markButton");
    const progress = document.getElementById("progress");
    const message = document.getElementById("message");
    const markingResult = document.getElementById("markingResult");
    const scoreText = document.getElementById("score");
    const feedbackText = document.getElementById("feedback");
    const correctAnswerText = document.getElementById("correctAnswer");
    const moduleTitle = document.getElementById("moduleTitle");
    const moduleDescription = document.getElementById("moduleDescription");
    const profileScoreInfo = document.getElementById("profileScoreInfo");
    const studentIdentity = document.getElementById("studentIdentity");
    const logoutButton = document.getElementById("logoutButton");
    const hus121Button = document.getElementById("hus121Button");
    const hus122Button = document.getElementById("hus122Button");

    function getQuestionList() {
      return moduleData[state.currentModule];
    }

    function getCurrentAnswer() {
      return state.answers[state.currentModule][state.currentQuestion] || "";
    }

    function saveCurrentAnswer() {
      const item = getQuestionList()[state.currentQuestion];
      if (!item) return;

      if (state.currentModule === "HUS121") {
        if (item.type === "mcq" || item.type === "tf" || item.type === "matching") {
          const checked = document.querySelector('input[name="objectiveAnswer"]:checked');
          state.answers.HUS121[state.currentQuestion] = checked ? checked.value : "";
        } else {
          state.answers.HUS121[state.currentQuestion] = answerBox.value;
        }
      } else {
        state.answers.HUS122[state.currentQuestion] = answerBox.value;
      }
    }

    function buildQuestionSelector() {
      const list = getQuestionList();
      questionSelect.innerHTML = "";

      list.forEach((_, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = `Question ${index + 1}`;
        questionSelect.appendChild(option);
      });

      questionSelect.value = String(state.currentQuestion);
    }

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .split(/\s+/)
        .filter(Boolean);
    }

    function markShortAnswer(answer, modelAnswer) {
      const trimmed = String(answer || "").trim();
      if (!trimmed) {
        return {
          score: 0,
          feedback: "Please write an answer before submitting.",
          correctAnswer: modelAnswer
        };
      }

      const answerWords = normalizeText(trimmed);
      const modelWords = normalizeText(modelAnswer)
        .filter(word => word.length > 3);

      const uniqueModelWords = [...new Set(modelWords)];
      const answerSet = new Set(answerWords);
      const matchCount = uniqueModelWords.filter(word => answerSet.has(word)).length;
      const coverage = uniqueModelWords.length ? matchCount / uniqueModelWords.length : 0;
      let score = Math.round(coverage * 100);

      if (answerWords.length < 5) {
        score = Math.min(score, 20);
      }

      let feedback = "";
      if (score >= 80) {
        feedback = "Strong answer. You included many of the key points from the model answer.";
      } else if (score >= 60) {
        feedback = "Good answer, but compare it with the model answer to identify details you missed.";
      } else if (score >= 40) {
        feedback = "Partially correct. Several important points are missing.";
      } else {
        feedback = "Your answer needs more of the key information. Review the model answer and try again in your own words.";
      }

      return {
        score,
        feedback,
        correctAnswer: modelAnswer
      };
    }

    function markHUS121Objective(item, userAnswer) {
      if (!userAnswer) {
        return {
          score: 0,
          feedback: "Please select an answer before submitting.",
          correctAnswer: item.type === "tf" ? item.answer : `${item.answer}. ${item.options[item.answer]}`
        };
      }

      const correct = userAnswer === item.answer;
      let feedback = correct ? "Correct. Good work." : "Incorrect. Review the correct answer and try the question again.";

      if (!correct && item.type === "tf" && item.correction) {
        feedback += ` Correct statement: ${item.correction}`;
      }

      return {
        score: correct ? 100 : 0,
        feedback,
        correctAnswer: item.type === "tf" ? item.answer : `${item.answer}. ${item.options[item.answer]}`
      };
    }

    function showMarkResult(result) {
      markingResult.hidden = false;
      scoreText.textContent = `Score: ${result.score}`;
      feedbackText.textContent = result.feedback || "";
      correctAnswerText.textContent = result.correctAnswer || "";
    }

    function renderQuestion() {
      const list = getQuestionList();
      const item = list[state.currentQuestion];
      if (!item) return;

      questionSelect.value = String(state.currentQuestion);

      const typeLabel = {
        mcq: "Multiple Choice",
        tf: "True / False",
        matching: "Matching",
        short: "Short Answer"
      };
      questionType.textContent = typeLabel[item.type] || "Question";
      questionText.textContent = `${state.currentQuestion + 1}. ${item.question}`;

      optionsContainer.innerHTML = "";
      optionsContainer.classList.add("hidden");
      writtenAnswerContainer.classList.add("hidden");

      const savedAnswer = getCurrentAnswer();

      if (item.type === "mcq" || item.type === "tf" || item.type === "matching") {
        optionsContainer.classList.remove("hidden");

        if (item.type === "mcq" || item.type === "matching") {
          Object.entries(item.options).forEach(([letter, text]) => {
            const label = document.createElement("label");
            label.className = "option";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = "objectiveAnswer";
            input.value = letter;
            if (savedAnswer === letter) input.checked = true;

            label.appendChild(input);
            label.appendChild(document.createTextNode(`${letter}. ${text}`));
            optionsContainer.appendChild(label);
          });
        } else {
          ["TRUE", "FALSE"].forEach(value => {
            const label = document.createElement("label");
            label.className = "option";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = "objectiveAnswer";
            input.value = value;
            if (savedAnswer === value) input.checked = true;

            label.appendChild(input);
            label.appendChild(document.createTextNode(value));
            optionsContainer.appendChild(label);
          });
        }
      } else {
        writtenAnswerContainer.classList.remove("hidden");
        answerBox.value = savedAnswer;
      }

      const answeredCount = Object.values(state.answers[state.currentModule]).filter(value => String(value || "").trim()).length;
      progress.textContent = `Question ${state.currentQuestion + 1} of ${list.length} • ${answeredCount} answered`;

      previousButton.disabled = state.currentQuestion === 0;
      nextButton.disabled = state.currentQuestion === list.length - 1;
      message.style.display = "none";

      if (state.marks[state.currentModule][state.currentQuestion]) {
        showMarkResult(state.marks[state.currentModule][state.currentQuestion]);
      } else {
        markingResult.hidden = true;
      }
    }

    function isAnswerProvided(item, answer) {
      const value = String(answer || "").trim();
      if (!value) return false;
      if (item.type === "mcq" || item.type === "tf" || item.type === "matching") {
        return value.length > 0;
      }
      return value.length > 0;
    }

    function showPreviousProfileScore(module) {
      const localKey = `examPrepAI_lastScore_${module}`;
      const saved = localStorage.getItem(localKey);
      const value = saved ? JSON.parse(saved) : null;

      if (value && value.score !== undefined) {
        profileScoreInfo.textContent = `Previous score: ${value.score}% (${value.questionLabel || "latest attempt"})`;
        return;
      }

      profileScoreInfo.textContent = "Previous score: —";
    }

    async function loadProfileScore(module) {
      if (!currentUser) {
        showPreviousProfileScore(module);
        return;
      }

      try {
        const profileRef = doc(db, "userProfiles", currentUser.uid);
        const docSnap = await getDoc(profileRef);
        const data = docSnap.exists() ? docSnap.data() : {};
        const scores = data.profileScores || {};
        const scoreData = scores[module];
        if (scoreData && scoreData.score !== undefined) {
          profileScoreInfo.textContent = `Previous score: ${scoreData.score}% (Question ${scoreData.question})`;
          localStorage.setItem(`examPrepAI_lastScore_${module}`, JSON.stringify({ score: scoreData.score, questionLabel: `Question ${scoreData.question}` }));
          return;
        }
      } catch (error) {
        console.warn("Unable to load saved profile score:", error);
      }

      showPreviousProfileScore(module);
    }

    async function saveProfileScore(module, score, questionNumber) {
      if (!currentUser || Number.isNaN(Number(score))) return;

      const profileData = {
        score: Number(score),
        question: questionNumber,
        module,
        updatedAt: new Date().toISOString()
      };

      try {
        const profileRef = doc(db, "userProfiles", currentUser.uid);
        const existingSnap = await getDoc(profileRef);
        const existing = existingSnap.exists() ? existingSnap.data() : {};
        const profileScores = existing.profileScores || {};
        profileScores[module] = profileData;

        await setDoc(profileRef, {
          ...existing,
          email: currentUser.email || existing.email || "",
          profileScores
        }, { merge: true });
      } catch (error) {
        console.warn("Unable to save score to profile:", error);
      }

      localStorage.setItem(`examPrepAI_lastScore_${module}`, JSON.stringify({ score: Number(score), questionLabel: `Question ${questionNumber}` }));
      profileScoreInfo.textContent = `Previous score: ${Number(score)}% (Question ${questionNumber})`;
    }

    function selectModule(module) {
      state.currentModule = module;
      state.currentQuestion = 0;

      hus121Button.classList.toggle("active", module === "HUS121");
      hus122Button.classList.toggle("active", module === "HUS122");

      if (module === "HUS121") {
        moduleTitle.textContent = "📚 HUS 121";
        moduleDescription.textContent = "Practice questions from your HUS 121 test memos.";
      } else {
        moduleTitle.textContent = "📚 HUS 122";
        moduleDescription.textContent = "Higher-order physiology revision questions.";
      }

      loadProfileScore(module);
      buildQuestionSelector();
      renderQuestion();
    }

    function changeQuestion(step) {
      saveCurrentAnswer();
      const newIndex = state.currentQuestion + step;
      const list = getQuestionList();

      if (newIndex >= 0 && newIndex < list.length) {
        state.currentQuestion = newIndex;
        renderQuestion();
      }
    }

    async function markAnswer() {
      saveCurrentAnswer();

      const list = getQuestionList();
      const item = list[state.currentQuestion];
      const userAnswer = state.answers[state.currentModule][state.currentQuestion] || "";

      if (!isAnswerProvided(item, userAnswer)) {
        message.style.display = "block";
        message.textContent = "Please answer the question before requesting marking.";
        return;
      }

      message.style.display = "block";
      message.textContent = "Marking...";
      markButton.disabled = true;
      markButton.textContent = "Marking...";

      try {
        let result;

        if (state.currentModule === "HUS121") {
          if (item.type === "mcq" || item.type === "tf" || item.type === "matching") {
            result = markHUS121Objective(item, userAnswer);
          } else {
            result = markShortAnswer(userAnswer, item.answer);
          }
        } else {
          try {
            const response = await fetch(MARKING_ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                questionNumber: state.currentQuestion + 1,
                question: item.question,
                answer: userAnswer
              })
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            result = await response.json();
            if (typeof result.score !== "number" && typeof result.score !== "string") {
              throw new Error("Invalid marking response.");
            }
            if (typeof result.feedback !== "string") {
              throw new Error("Invalid feedback response.");
            }
            if (!result.correctAnswer) {
              result.correctAnswer = item.answer;
            }
          } catch (error) {
            console.warn("Server marking unavailable:", error);
            result = markShortAnswer(userAnswer, item.answer);
            message.textContent = "AI marking is unavailable, so a local fallback score was used.";
          }
        }

        state.marks[state.currentModule][state.currentQuestion] = result;
        showMarkResult(result);

        const numericScore = Number(result.score);
        if (!Number.isNaN(numericScore)) {
          await saveProfileScore(state.currentModule, numericScore, state.currentQuestion + 1);
        }

        if (!message.textContent.includes("AI marking is unavailable")) {
          message.textContent = "Marking complete.";
        }
      } catch (error) {
        console.error(error);
        message.textContent = "Something went wrong while marking this answer.";
      } finally {
        markButton.disabled = false;
        markButton.textContent = "Mark Answer";
      }
    }

    hus121Button.addEventListener("click", () => selectModule("HUS121"));
    hus122Button.addEventListener("click", () => selectModule("HUS122"));

    questionSelect.addEventListener("change", () => {
      saveCurrentAnswer();
      state.currentQuestion = Number(questionSelect.value);
      renderQuestion();
    });

    answerBox.addEventListener("input", () => {
      if (state.currentModule === "HUS122") {
        state.answers.HUS122[state.currentQuestion] = answerBox.value;
      } else {
        state.answers.HUS121[state.currentQuestion] = answerBox.value;
      }
      delete state.marks[state.currentModule][state.currentQuestion];
    });

    optionsContainer.addEventListener("change", (event) => {
      if (event.target.matches('input[name="objectiveAnswer"]')) {
        state.answers.HUS121[state.currentQuestion] = event.target.value;
        delete state.marks.HUS121[state.currentQuestion];
      }
    });

    previousButton.addEventListener("click", () => changeQuestion(-1));
    nextButton.addEventListener("click", () => changeQuestion(1));
    markButton.addEventListener("click", markAnswer);

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      logoutButton.textContent = "Logging out...";

      try {
        await signOut(auth);
        window.location.assign("/");
      } catch (error) {
        console.error(error);
        logoutButton.disabled = false;
        logoutButton.textContent = "Log Out";
        alert("Unable to log out. Please try again.");
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.assign("/");
        return;
      }

      if (!user.emailVerified) {
        window.location.assign("/");
        return;
      }

      currentUser = user;
      studentIdentity.textContent = `Logged in as: ${user.email}`;
      loadingPage.classList.add("hidden");
      practicePage.classList.remove("hidden");
      selectModule("HUS121");
    });
  </script>
</body>
</html>
