<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPrep AI</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #0f172a;
      --border: #dbe2ec;
      --success: #166534;
      --success-bg: #dcfce7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --warning: #c2410c;
      --warning-bg: #ffedd5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      background: var(--accent);
      color: #fff;
      padding: 24px 20px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.5rem);
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    #studentIdentity {
      margin-top: 12px;
      color: #dbeafe;
      font-size: 0.95rem;
    }

    #logoutButton {
      margin-top: 12px;
      padding: 10px 18px;
      border: none;
      border-radius: 7px;
      background: #b91c1c;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
    }

    #logoutButton:hover { background: #991b1b; }

    .container {
      max-width: 980px;
      margin: 32px auto;
      padding: 0 18px 48px;
    }

    .card {
      background: var(--panel);
      border-radius: 14px;
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.08);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 { margin-top: 0; }

    .loading {
      text-align: center;
      font-size: 1.1rem;
      padding: 36px 20px;
    }

    .moduleButtons {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .moduleButton {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      padding: 22px 18px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .moduleButton:hover {
      transform: translateY(-1px);
    }

    .moduleButton.active {
      background: var(--primary);
    }

    .moduleButton strong {
      display: block;
      font-size: 1.25rem;
    }

    .moduleButton span {
      display: block;
      margin-top: 8px;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      padding: 12px 14px;
      font-size: 1rem;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    .options {
      margin-top: 16px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fafcff;
      margin: 10px 0;
      cursor: pointer;
    }

    .option:hover {
      background: #eef4ff;
    }

    .option input {
      margin: 0;
      transform: scale(1.1);
    }

    .questionType {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: bold;
      background: #e5e7eb;
      color: #374151;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .question {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      line-height: 1.5;
      font-weight: bold;
    }

    .navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .navButton,
    button {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 1rem;
    }

    .navButton:hover,
    button:hover {
      background: #374151;
    }

    .navButton:disabled,
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #markButton {
      display: block;
      width: 100%;
      margin-top: 18px;
      background: var(--primary);
      font-weight: bold;
    }

    #markButton:hover { background: var(--primary-dark); }

    #progress {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      flex: 1;
    }

    #message {
      margin-top: 18px;
      display: none;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.95rem;
    }

    #markingResult {
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
    }

    #markingResult[hidden] {
      display: none;
    }

    #score {
      font-weight: bold;
      margin: 0 0 8px;
    }

    #feedback {
      margin: 0 0 10px;
      line-height: 1.5;
    }

    #correctAnswerPanel {
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    #correctAnswerPanel h3 {
      margin: 0 0 8px;
    }

    #correctAnswer {
      margin: 0;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .moduleButtons {
        grid-template-columns: 1fr;
      }

      .navigation {
        flex-direction: column;
        align-items: stretch;
      }

      .navButton {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎓 ExamPrep AI</h1>
    <p>Practice. Answer. Improve.</p>
    <p id="studentIdentity">Checking your account...</p>
    <button id="logoutButton" type="button">Log Out</button>
  </header>

  <main class="container">
    <div id="loadingPage" class="card loading">Checking your login...</div>

    <div id="practicePage" class="hidden">
      <div class="card">
        <h2>📚 Choose Your Module</h2>
        <p>Select the module you want to practice.</p>
        <div class="moduleButtons">
          <button id="hus121Button" class="moduleButton active" type="button">
            <strong>HUS 121</strong>
            <span>Human Development &amp; Motor Development</span>
          </button>

          <button id="hus122Button" class="moduleButton" type="button">
            <strong>HUS 122</strong>
            <span>Physiology</span>
          </button>
        </div>
      </div>

      <div class="card">
        <h2 id="moduleTitle">📚 HUS 121</h2>
        <p id="moduleDescription">Practice questions from your HUS 121 test memos.</p>
      </div>

      <div class="card">
        <h2>Choose a Question</h2>
        <label for="questionSelect">Question</label>
        <select id="questionSelect"></select>
      </div>

      <div class="card">
        <span id="questionType" class="questionType">Question</span>
        <p id="questionText" class="question" aria-live="polite"></p>

        <div id="optionsContainer" class="options hidden"></div>

        <div id="writtenAnswerContainer" class="hidden">
          <label for="studentAnswer">Your answer</label>
          <textarea id="studentAnswer" placeholder="Write your answer here..."></textarea>
        </div>

        <div class="navigation">
          <button id="previousButton" class="navButton" type="button">Previous</button>
          <span id="progress" aria-live="polite"></span>
          <button id="nextButton" class="navButton" type="button">Next</button>
        </div>

        <button id="markButton" type="button">Mark Answer</button>
        <div id="message" role="status" aria-live="polite"></div>

        <section id="markingResult" aria-live="polite" hidden>
          <h2>Marking feedback</h2>
          <p id="score"></p>
          <p id="feedback"></p>

          <div id="correctAnswerPanel">
            <h3>Correct answer</h3>
            <p id="correctAnswer"></p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script type="module">
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { auth } from "./firebase.js";

    const MARKING_ENDPOINT = "/mark";

    const hus121Questions = [
      {
        type: "mcq",
        question: "Piaget's Concrete Operational Stage occurs from:",
        options: {
          A: "Birth to 2 years",
          B: "2 to 7 years",
          C: "7 to 11 years",
          D: "11 years onwards"
        },
        answer: "C"
      },
      {
        type: "tf",
        question: "The embryonic period extends from the eighth week until birth.",
        answer: "FALSE",
        correction: "The fetal period extends from the eighth week until birth."
      },
      {
        type: "matching",
        question: "Development proceeds from simple to complex",
        options: {
          A: "The tempo of development is not even.",
          B: "The surrounding environment can encourage or hinder development.",
          C: "The head region starts growth first, followed by other organs.",
          D: "Children must mature before they can progress to new skills.",
          E: "The fetus moves its whole body but is incapable of specific responses.",
          F: "Every child develops at his or her own pace.",
          G: "Growth has certain characteristics common at particular stages.",
          H: "Growth and development is a continuous process from conception to death."
        },
        answer: "C"
      },
      {
        type: "short",
        question: "Identify the four steps of drawing development during early childhood.",
        answer: "Scribbling stage, combined stage, aggregate stage, pictorial stage."
      },
      {
        type: "short",
        question: "What psychosocial theory of development occurs from 6 to 11 years according to Erikson?",
        answer: "Industry versus inferiority."
      },
      {
        type: "mcq",
        question: "Which parenting style is characterized by low control and high warmth?",
        options: {
          A: "Authoritarian",
          B: "Permissive-indulgent",
          C: "Authoritative",
          D: "Permissive-neglectful"
        },
        answer: "B"
      },
      {
        type: "matching",
        question: "Individual growth patterns are unique",
        options: {
          A: "The tempo of development is not even.",
          B: "The surrounding environment can encourage or hinder development.",
          C: "The head region develops first, followed by other organs.",
          D: "Children must mature before they can progress to new skills.",
          E: "The fetus moves its whole body but is incapable of specific responses.",
          F: "Every child develops at his or her own pace.",
          G: "Growth has certain characteristics common at particular stages.",
          H: "Growth and development is a continuous process from conception to death."
        },
        answer: "F"
      },
      {
        type: "tf",
        question: "Reflexive movements occur quickly after the onset of a stimulus.",
        answer: "TRUE"
      }
    ];

    const hus122Questions = [
      {
        question: "Explain the role of digestion, absorption and insulin in helping muscle cells obtain energy from a carbohydrate-rich meal during exercise.",
        answer: "Carbohydrate digestion starts in the mouth and continues in the small intestine where amylase breaks starch into glucose. Glucose is absorbed by enterocytes mainly through SGLT1-mediated transport and enters the bloodstream. Blood glucose rises, stimulating insulin secretion from the pancreas. Insulin promotes glucose uptake into muscle and liver cells, and the glucose is used in glycolysis to make ATP during exercise. Without efficient digestion and insulin action, muscles would not receive enough glucose to support exercise performance."
      },
      {
        question: "A person produces normal amounts of pancreatic amylase but has very low levels of maltase in the small intestine. Predict how this affects carbohydrate digestion and glucose availability.",
        answer: "Pancreatic amylase will still break starch into maltose, but low maltase means maltose is not efficiently converted into glucose in the brush border. As a result, less glucose is available for absorption, blood glucose rises less after the meal, and less glucose reaches working muscle and other tissues. This reduces ATP production from carbohydrate metabolism and may lower exercise capacity."
      },
      {
        question: "Explain why bile is important for lipid digestion even though bile itself is not a digestive enzyme.",
        answer: "Bile salts emulsify large lipid droplets into smaller droplets, increasing the surface area exposed to pancreatic lipase. This allows fat digestion to occur more efficiently. Without enough bile, lipids are not digested and absorbed well, reducing the availability of fatty acids and energy during exercise."
      },
      {
        question: "Compare the roles of insulin and glucagon in maintaining blood glucose homeostasis.",
        answer: "Insulin is released when blood glucose rises after a meal. It promotes glucose uptake into cells and glycogen synthesis, lowering blood glucose. Glucagon is released when blood glucose falls; it stimulates glycogen breakdown and gluconeogenesis in the liver, raising blood glucose. These hormones work in opposite directions to keep blood glucose within a normal range."
      },
      {
        question: "Describe how the thyroid hormones influence metabolism, body temperature and exercise performance.",
        answer: "T3 and T4 increase basal metabolic rate, stimulate oxygen consumption and support mitochondrial activity. They increase heat production and help maintain body temperature. In exercise, adequate thyroid hormone levels support efficient energy metabolism and endurance, whereas low levels can reduce metabolic rate and impair performance."
      }
    ];

    const moduleData = {
      HUS121: hus121Questions,
      HUS122: hus122Questions
    };

    const state = {
      currentModule: "HUS121",
      currentQuestion: 0,
      answers: { HUS121: {}, HUS122: {} },
      marks: { HUS121: {}, HUS122: {} }
    };

    const loadingPage = document.getElementById("loadingPage");
    const practicePage = document.getElementById("practicePage");
    const questionSelect = document.getElementById("questionSelect");
    const questionText = document.getElementById("questionText");
    const questionType = document.getElementById("questionType");
    const optionsContainer = document.getElementById("optionsContainer");
    const writtenAnswerContainer = document.getElementById("writtenAnswerContainer");
    const answerBox = document.getElementById("studentAnswer");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const markButton = document.getElementById("markButton");
    const progress = document.getElementById("progress");
    const message = document.getElementById("message");
    const markingResult = document.getElementById("markingResult");
    const scoreText = document.getElementById("score");
    const feedbackText = document.getElementById("feedback");
    const correctAnswerText = document.getElementById("correctAnswer");
    const moduleTitle = document.getElementById("moduleTitle");
    const moduleDescription = document.getElementById("moduleDescription");
    const studentIdentity = document.getElementById("studentIdentity");
    const logoutButton = document.getElementById("logoutButton");
    const hus121Button = document.getElementById("hus121Button");
    const hus122Button = document.getElementById("hus122Button");

    function getQuestionList() {
      return moduleData[state.currentModule];
    }

    function getCurrentAnswer() {
      return state.answers[state.currentModule][state.currentQuestion] || "";
    }

    function saveCurrentAnswer() {
      const item = getQuestionList()[state.currentQuestion];
      if (!item) return;

      if (state.currentModule === "HUS121") {
        if (item.type === "mcq" || item.type === "tf" || item.type === "matching") {
          const checked = document.querySelector('input[name="objectiveAnswer"]:checked');
          state.answers.HUS121[state.currentQuestion] = checked ? checked.value : "";
        } else {
          state.answers.HUS121[state.currentQuestion] = answerBox.value;
        }
      } else {
        state.answers.HUS122[state.currentQuestion] = answerBox.value;
      }
    }

    function buildQuestionSelector() {
      const list = getQuestionList();
      questionSelect.innerHTML = "";

      list.forEach((_, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = `Question ${index + 1}`;
        questionSelect.appendChild(option);
      });

      questionSelect.value = String(state.currentQuestion);
    }

    function normalizeText(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .split(/\s+/)
        .filter(Boolean);
    }

    function markShortAnswer(answer, modelAnswer) {
      const trimmed = String(answer || "").trim();
      if (!trimmed) {
        return {
          score: 0,
          feedback: "Please write an answer before submitting.",
          correctAnswer: modelAnswer
        };
      }

      const answerWords = normalizeText(trimmed);
      const modelWords = normalizeText(modelAnswer)
        .filter(word => word.length > 3);

      const uniqueModelWords = [...new Set(modelWords)];
      const answerSet = new Set(answerWords);
      const matchCount = uniqueModelWords.filter(word => answerSet.has(word)).length;
      const coverage = uniqueModelWords.length ? matchCount / uniqueModelWords.length : 0;
      let score = Math.round(coverage * 100);

      if (answerWords.length < 5) {
        score = Math.min(score, 20);
      }

      let feedback = "";
      if (score >= 80) {
        feedback = "Strong answer. You included many of the key points from the model answer.";
      } else if (score >= 60) {
        feedback = "Good answer, but compare it with the model answer to identify details you missed.";
      } else if (score >= 40) {
        feedback = "Partially correct. Several important points are missing.";
      } else {
        feedback = "Your answer needs more of the key information. Review the model answer and try again in your own words.";
      }

      return {
        score,
        feedback,
        correctAnswer: modelAnswer
      };
    }

    function markHUS121Objective(item, userAnswer) {
      if (!userAnswer) {
        return {
          score: 0,
          feedback: "Please select an answer before submitting.",
          correctAnswer: item.type === "tf" ? item.answer : `${item.answer}. ${item.options[item.answer]}`
        };
      }

      const correct = userAnswer === item.answer;
      let feedback = correct ? "Correct. Good work." : "Incorrect. Review the correct answer and try the question again.";

      if (!correct && item.type === "tf" && item.correction) {
        feedback += ` Correct statement: ${item.correction}`;
      }

      return {
        score: correct ? 100 : 0,
        feedback,
        correctAnswer: item.type === "tf" ? item.answer : `${item.answer}. ${item.options[item.answer]}`
      };
    }

    function showMarkResult(result) {
      markingResult.hidden = false;
      scoreText.textContent = `Score: ${result.score}`;
      feedbackText.textContent = result.feedback || "";
      correctAnswerText.textContent = result.correctAnswer || "";
    }

    function renderQuestion() {
      const list = getQuestionList();
      const item = list[state.currentQuestion];
      if (!item) return;

      questionSelect.value = String(state.currentQuestion);

      const typeLabel = {
        mcq: "Multiple Choice",
        tf: "True / False",
        matching: "Matching",
        short: "Short Answer"
      };
      questionType.textContent = typeLabel[item.type] || "Question";
      questionText.textContent = `${state.currentQuestion + 1}. ${item.question}`;

      optionsContainer.innerHTML = "";
      optionsContainer.classList.add("hidden");
      writtenAnswerContainer.classList.add("hidden");

      const savedAnswer = getCurrentAnswer();

      if (item.type === "mcq" || item.type === "tf" || item.type === "matching") {
        optionsContainer.classList.remove("hidden");

        if (item.type === "mcq" || item.type === "matching") {
          Object.entries(item.options).forEach(([letter, text]) => {
            const label = document.createElement("label");
            label.className = "option";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = "objectiveAnswer";
            input.value = letter;
            if (savedAnswer === letter) input.checked = true;

            label.appendChild(input);
            label.appendChild(document.createTextNode(`${letter}. ${text}`));
            optionsContainer.appendChild(label);
          });
        } else {
          ["TRUE", "FALSE"].forEach(value => {
            const label = document.createElement("label");
            label.className = "option";

            const input = document.createElement("input");
            input.type = "radio";
            input.name = "objectiveAnswer";
            input.value = value;
            if (savedAnswer === value) input.checked = true;

            label.appendChild(input);
            label.appendChild(document.createTextNode(value));
            optionsContainer.appendChild(label);
          });
        }
      } else {
        writtenAnswerContainer.classList.remove("hidden");
        answerBox.value = savedAnswer;
      }

      const answeredCount = Object.values(state.answers[state.currentModule]).filter(value => String(value || "").trim()).length;
      progress.textContent = `Question ${state.currentQuestion + 1} of ${list.length} • ${answeredCount} answered`;

      previousButton.disabled = state.currentQuestion === 0;
      nextButton.disabled = state.currentQuestion === list.length - 1;
      message.style.display = "none";

      if (state.marks[state.currentModule][state.currentQuestion]) {
        showMarkResult(state.marks[state.currentModule][state.currentQuestion]);
      } else {
        markingResult.hidden = true;
      }
    }

    function selectModule(module) {
      state.currentModule = module;
      state.currentQuestion = 0;

      hus121Button.classList.toggle("active", module === "HUS121");
      hus122Button.classList.toggle("active", module === "HUS122");

      if (module === "HUS121") {
        moduleTitle.textContent = "📚 HUS 121";
        moduleDescription.textContent = "Practice questions from your HUS 121 test memos.";
      } else {
        moduleTitle.textContent = "📚 HUS 122";
        moduleDescription.textContent = "Higher-order physiology revision questions.";
      }

      buildQuestionSelector();
      renderQuestion();
    }

    function changeQuestion(step) {
      saveCurrentAnswer();
      const newIndex = state.currentQuestion + step;
      const list = getQuestionList();

      if (newIndex >= 0 && newIndex < list.length) {
        state.currentQuestion = newIndex;
        renderQuestion();
      }
    }

    async function markAnswer() {
      saveCurrentAnswer();

      const list = getQuestionList();
      const item = list[state.currentQuestion];
      const userAnswer = state.answers[state.currentModule][state.currentQuestion] || "";

      message.style.display = "block";
      message.textContent = "Marking...";
      markButton.disabled = true;
      markButton.textContent = "Marking...";

      try {
        let result;

        if (state.currentModule === "HUS121") {
          if (item.type === "mcq" || item.type === "tf" || item.type === "matching") {
            result = markHUS121Objective(item, userAnswer);
          } else {
            result = markShortAnswer(userAnswer, item.answer);
          }
        } else {
          if (!userAnswer.trim()) {
            result = {
              score: 0,
              feedback: "Please write an answer before requesting marking.",
              correctAnswer: item.answer
            };
          } else {
            try {
              const response = await fetch(MARKING_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  questionNumber: state.currentQuestion + 1,
                  question: item.question,
                  answer: userAnswer
                })
              });

              if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
              }

              result = await response.json();
              if (typeof result.score !== "number" && typeof result.score !== "string") {
                throw new Error("Invalid marking response.");
              }
              if (typeof result.feedback !== "string") {
                throw new Error("Invalid feedback response.");
              }
              if (!result.correctAnswer) {
                result.correctAnswer = item.answer;
              }
            } catch (error) {
              console.warn("Server marking unavailable:", error);
              result = markShortAnswer(userAnswer, item.answer);
              message.textContent = "AI marking is unavailable, so a local fallback score was used.";
            }
          }
        }

        state.marks[state.currentModule][state.currentQuestion] = result;
        showMarkResult(result);

        if (!message.textContent.includes("AI marking is unavailable")) {
          message.textContent = "Marking complete.";
        }
      } catch (error) {
        console.error(error);
        message.textContent = "Something went wrong while marking this answer.";
      } finally {
        markButton.disabled = false;
        markButton.textContent = "Mark Answer";
      }
    }

    hus121Button.addEventListener("click", () => selectModule("HUS121"));
    hus122Button.addEventListener("click", () => selectModule("HUS122"));

    questionSelect.addEventListener("change", () => {
      saveCurrentAnswer();
      state.currentQuestion = Number(questionSelect.value);
      renderQuestion();
    });

    answerBox.addEventListener("input", () => {
      if (state.currentModule === "HUS122") {
        state.answers.HUS122[state.currentQuestion] = answerBox.value;
      } else {
        state.answers.HUS121[state.currentQuestion] = answerBox.value;
      }
      delete state.marks[state.currentModule][state.currentQuestion];
    });

    optionsContainer.addEventListener("change", (event) => {
      if (event.target.matches('input[name="objectiveAnswer"]')) {
        state.answers.HUS121[state.currentQuestion] = event.target.value;
        delete state.marks.HUS121[state.currentQuestion];
      }
    });

    previousButton.addEventListener("click", () => changeQuestion(-1));
    nextButton.addEventListener("click", () => changeQuestion(1));
    markButton.addEventListener("click", markAnswer);

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      logoutButton.textContent = "Logging out...";

      try {
        await signOut(auth);
        window.location.assign("/");
      } catch (error) {
        console.error(error);
        logoutButton.disabled = false;
        logoutButton.textContent = "Log Out";
        alert("Unable to log out. Please try again.");
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.assign("/");
        return;
      }

      if (!user.emailVerified) {
        window.location.assign("/");
        return;
      }

      studentIdentity.textContent = `Logged in as: ${user.email}`;
      loadingPage.classList.add("hidden");
      practicePage.classList.remove("hidden");
      selectModule("HUS121");
    });
  </script>
</body>
</html>
