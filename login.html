<!DOCTYPE html>
<html>
<head>
<title>ExamPrepAI - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#1e293b;padding:40px;border-radius:15px;width:350px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;background:#334155;color:white;box-sizing:border-box}
button{width:100%;padding:12px;background:#3b82f6;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:10px}
button:hover{background:#2563eb}
h2{text-align:center;color:#60a5fa}
.error{color:#f87171;text-align:center;margin-top:10px;font-size:13px}
.success{color:#4ade80;text-align:center;margin-top:10px}
.link{text-align:center;margin-top:15px;font-size:14px}
.link button{width:auto;margin:0;padding:0;background:none;color:#60a5fa;font:inherit;text-decoration:underline}
.link button:hover{background:none;color:#93c5fd}
button:disabled{opacity:.65;cursor:wait}
</style>
</head>
<body>
<div class="box">
<h2>ExamPrepAI Login</h2>
<form id="auth-form">
  <input id="email" type="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
  <input id="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
  <button id="login-button" type="submit">Login</button>
  <button id="signup-button" type="button" style="background:#10b981">Sign Up</button>
</form>
<div id="msg" role="status" aria-live="polite"></div>
<div class="link"><button id="reset-button" type="button">Forgot Password?</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQJDo6KsPtinXd525Hv4MIg7YbnJBi204",
  authDomain: "examprepai-8db41.firebaseapp.com",
  projectId: "examprepai-8db41",
  storageBucket: "examprepai-8db41.firebasestorage.app",
  messagingSenderId: "102205308525",
  appId: "1:102205308525:web:8e49533c2f04cc60a20964"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const form = document.getElementById('auth-form');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const message = document.getElementById('msg');
const buttons = [...form.querySelectorAll('button'), document.getElementById('reset-button')];

// If already logged in, go to exam
onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = "/exam";
});

function setMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

function getErrorMessage(error) {
  const messages = {
    'auth/email-already-in-use': 'An account already exists for this email. Try logging in instead.',
    'auth/invalid-credential': 'The email or password is incorrect.',
    'auth/invalid-email': 'Enter a valid email address.',
    'auth/too-many-requests': 'Too many attempts. Please wait a while and try again.',
    'auth/weak-password': 'Choose a password with at least 6 characters.',
    'auth/user-disabled': 'This account has been disabled. Contact support.',
    'auth/user-not-found': 'No account was found for this email.',
    'auth/wrong-password': 'The email or password is incorrect.'
  };
  return messages[error.code] || error.message || 'Something went wrong. Please try again.';
}

async function runAction(action, successMessage) {
  buttons.forEach((button) => { button.disabled = true; });
  setMessage('', '');
  try {
    await action();
    setMessage(successMessage, 'success');
  } catch (error) {
    setMessage(getErrorMessage(error), 'error');
  } finally {
    buttons.forEach((button) => { button.disabled = false; });
  }
}

form.addEventListener('submit', (event) => {
  event.preventDefault();
  if (!form.reportValidity()) return;
  const email = emailInput.value.trim();
  runAction(
    () => signInWithEmailAndPassword(auth, email, passwordInput.value),
    'Login successful! Redirecting...'
  );
});

document.getElementById('signup-button').addEventListener('click', () => {
  if (!form.reportValidity()) return;
  const email = emailInput.value.trim();
  runAction(
    () => createUserWithEmailAndPassword(auth, email, passwordInput.value),
    'Account created! Redirecting...'
  );
});

document.getElementById('reset-button').addEventListener('click', () => {
  const email = emailInput.value.trim();
  if (!email) {
    emailInput.setCustomValidity('Enter your email address to reset your password.');
    emailInput.reportValidity();
    emailInput.setCustomValidity('');
    return;
  }
  if (!emailInput.checkValidity()) {
    emailInput.reportValidity();
    return;
  }
  runAction(
    () => sendPasswordResetEmail(auth, email),
    'If an account exists for this email, a password reset link has been sent.'
  );
});
</script>
</body>
</html>
